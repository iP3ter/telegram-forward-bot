name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  workflow_dispatch:  # 手动触发

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install wrangler -g

      # ============ 1. 动态替换配置 (无回显) ============
      - name: Update wrangler.toml
        run: |
          sed -i 's/ADMIN_ID_PLACEHOLDER/${{ secrets.ADMIN_ID }}/g' wrangler.toml
          sed -i 's/KV_ID_PLACEHOLDER/${{ secrets.KV_ID }}/g' wrangler.toml
          sed -i 's/BOT_USERNAME_PLACEHOLDER/${{ secrets.BOT_USERNAME }}/g' wrangler.toml
          
          # 如果有其他可选配置
          if [ -n "${{ secrets.CAPTCHA_TYPE }}" ]; then
            sed -i 's/CAPTCHA_TYPE = "button"/CAPTCHA_TYPE = "${{ secrets.CAPTCHA_TYPE }}"/g' wrangler.toml
          fi
          
          echo "✅ Configuration updated."
        env:
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          KV_ID: ${{ secrets.KV_ID }}

      # ============ 2. 部署 Worker (隐藏日志中的 URL) ============
      - name: Deploy to Cloudflare Workers (Silent)
        run: |
          # 将输出重定向到文件，成功时不打印，失败时才打印
          if wrangler deploy > deploy.log 2>&1; then
            echo "✅ Deployment Successful!"
            echo "🔒 Logs hidden to protect privacy."
          else
            echo "❌ Deployment Failed. Showing logs:"
            cat deploy.log
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # ============ 3. 设置 Secrets (静默) ============
      - name: Set Bot Token Secret
        run: echo "${{ secrets.BOT_TOKEN }}" | wrangler secret put BOT_TOKEN > /dev/null 2>&1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      # ============ 4. 自动设置 Webhook (修复报错版) ============
      - name: Setup Webhook (Silent)
        env:
          # 关键修改：将 Secret 映射为环境变量，在脚本内部使用
          TARGET_URL: ${{ secrets.WORKER_URL }}
        run: |
          # 在脚本内部判断：如果变量为空，则跳过
          if [ -z "$TARGET_URL" ]; then
             echo "⚠️ WORKER_URL secret not set. Skipping setup."
             exit 0
          fi

          echo "⏳ Waiting for DNS propagation (10s)..."
          sleep 10
          
          echo "🚀 Sending setup request..."
          
          # curl 参数说明：
          # -s: 静默模式
          # -o /dev/null: 丢弃响应体
          # -w "%{http_code}": 只打印 HTTP 状态码
          
          status_code=$(curl -s -o /dev/null -w "%{http_code}" "${TARGET_URL}/setup")
          
          if [ "$status_code" -eq 200 ]; then
            echo "✅ Webhook Setup: OK (200)"
          else
            echo "❌ Webhook Setup Failed. HTTP Code: $status_code"
            # 失败也不打印 URL，只提示错误码
            exit 1
          fi
